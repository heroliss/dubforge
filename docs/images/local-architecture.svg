<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">DubForge 在本机如何运行</title>
  <desc id="architecture-desc">浏览器界面访问本机的 Python 主程序。主程序使用 SQLite 保存项目和回执，将字幕、音频与成片保存在本机文件中，并调用 FFmpeg、FFprobe 和 yt-dlp 处理媒体。模型与配音能力按需使用本地模型或独立服务。B 站交付可选，由本地 Node.js 工作者连接平台。这是架构示意图，不是界面截图。</desc>
  <defs>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#8fa3bb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="1" y="1" width="1178" height="448" rx="22" fill="#0f141b" stroke="#344357" stroke-width="2"/>
    <text x="30" y="46" font-size="27" font-weight="700" fill="#edf3fc">浏览器打开，本机制作</text>
    <text x="1150" y="44" text-anchor="end" font-size="18" fill="#b3c1d2">按需连接工具与服务</text>

    <g fill="none" stroke="#8fa3bb" stroke-width="1.8" marker-end="url(#architecture-arrow)">
      <path d="M270 221h41"/>
      <path d="M640 221h42V132h39"/>
      <path d="M640 221h42v25h39" stroke-dasharray="5 5"/>
      <path d="M640 221h42v139h39" stroke-dasharray="5 5"/>
    </g>

    <g>
      <rect x="30" y="151" width="240" height="140" rx="16" fill="#1a222e" stroke="#344357" stroke-width="1.5"/>
      <rect x="49" y="169" width="36" height="27" rx="4" fill="#202f46" stroke="#8bb9ff" stroke-width="1.8"/>
      <path d="M50 177h34" fill="none" stroke="#8bb9ff" stroke-width="1.5"/>
      <circle cx="55" cy="173" r="1.3" fill="#8bb9ff"/><circle cx="60" cy="173" r="1.3" fill="#8bb9ff"/>
      <text x="96" y="192" font-size="23" font-weight="700" fill="#edf3fc">浏览器界面</text>
      <text x="49" y="232" font-size="19" fill="#b3c1d2">Vue 3 · 本机访问</text>
      <text x="49" y="266" font-size="19" fill="#b3c1d2">编辑、预览、查看进度</text>
    </g>

    <g>
      <rect x="320" y="111" width="320" height="220" rx="17" fill="#1a222e" stroke="#6487b3" stroke-width="1.8"/>
      <path d="M337 111h286a17 17 0 0 1 17 17v58H320v-58a17 17 0 0 1 17-17" fill="#202f46"/>
      <text x="340" y="144" font-size="23" font-weight="700" fill="#edf3fc">本地 Python 主程序</text>
      <text x="340" y="173" font-size="18" fill="#8bb9ff">FastAPI · 制作与恢复</text>
      <g fill="none" stroke="#b3c1d2" stroke-width="1.8">
        <ellipse cx="354" cy="215" rx="13" ry="5"/>
        <path d="M341 215v20c0 7 26 7 26 0v-20m-26 10c0 7 26 7 26 0"/>
        <path d="M342 269h15l9 9v23h-24zM357 269v10h9"/>
      </g>
      <text x="380" y="219" font-size="20" font-weight="600" fill="#edf3fc">SQLite</text>
      <text x="380" y="246" font-size="18" fill="#b3c1d2">项目、任务与发布回执</text>
      <text x="380" y="281" font-size="20" font-weight="600" fill="#edf3fc">本机文件</text>
      <text x="380" y="308" font-size="18" fill="#b3c1d2">字幕、音频与成片</text>
    </g>

    <g>
      <rect x="730" y="83" width="420" height="98" rx="15" fill="#1a222e" stroke="#344357" stroke-width="1.5"/>
      <rect x="749" y="101" width="36" height="36" rx="9" fill="#432b20"/>
      <g fill="none" stroke="#ffba85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m760 111 14 8-14 8zM756 110v18m22-18v18"/>
      </g>
      <text x="797" y="127" font-size="23" font-weight="700" fill="#edf3fc">媒体处理</text>
      <text x="750" y="161" font-size="19" fill="#b3c1d2">FFmpeg / FFprobe · yt-dlp</text>
    </g>

    <g>
      <rect x="730" y="197" width="420" height="98" rx="15" fill="#1a222e" stroke="#344357" stroke-width="1.5"/>
      <rect x="749" y="215" width="36" height="36" rx="9" fill="#163930"/>
      <g fill="none" stroke="#7ed8c7" stroke-width="2" stroke-linecap="round">
        <path d="M757 227v11m6-17v23m7-20v17m7-12v7"/>
      </g>
      <text x="797" y="241" font-size="23" font-weight="700" fill="#edf3fc">模型与配音服务</text>
      <rect x="1068" y="214" width="62" height="30" rx="9" fill="#163930"/>
      <text x="1099" y="236" text-anchor="middle" font-size="18" font-weight="600" fill="#7ed8c7">按需</text>
      <text x="750" y="275" font-size="19" fill="#b3c1d2">使用本地模型，或连接独立服务</text>
    </g>

    <g>
      <rect x="730" y="311" width="420" height="98" rx="15" fill="#1a222e" stroke="#344357" stroke-width="1.5"/>
      <rect x="749" y="329" width="36" height="36" rx="9" fill="#202f46"/>
      <g fill="none" stroke="#8bb9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M756 350v7h22v-7m-11-2v-15m-6 6 6-6 6 6"/>
      </g>
      <text x="797" y="355" font-size="23" font-weight="700" fill="#edf3fc">B 站交付</text>
      <rect x="1068" y="328" width="62" height="30" rx="9" fill="#202f46"/>
      <text x="1099" y="350" text-anchor="middle" font-size="18" font-weight="600" fill="#8bb9ff">可选</text>
      <text x="750" y="389" font-size="19" fill="#b3c1d2">本地 Node.js 工作者连接 B 站</text>
    </g>

    <text x="30" y="432" font-size="18" fill="#b3c1d2">配置、项目与产物默认保存在本机；模型服务及外部平台按需连接。</text>
  </g>
</svg>
