[project]
name = "dubforge"
version = "0.1.0"
description = "DubForge —— 视频翻译配音工作台（下载/转录/翻译/配音/成片一站式流水线）"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # ---- M2 媒体处理链 ----
    "yt-dlp>=2025.9.26",
    "faster-whisper>=1.1.0",
    "demucs>=4.0.1",
    # 显式声明 torch 以使下方 CUDA index 生效 (传递依赖不受 sources 控制)
    "torch>=2.6",
    "torchaudio>=2.6",
    "soundfile>=0.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    # ---- M3 配音链 ----
    "gradio-client>=1.8",
]

# torch 走 CUDA wheel (默认 PyPI 在 Windows 只发 CPU 版); 8G 显存 GPU 加速
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dubforge", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
