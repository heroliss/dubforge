[project]
name = "dubforge"
version = "0.1.0"
description = "DubForge —— 视频翻译配音工作台（下载/转录/翻译/配音/成片一站式流水线）"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dubforge", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
